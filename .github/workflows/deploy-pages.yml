name: Deploy CDLU static portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject browser API keys
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          sed -i "s|AIzaSyDBslgxNbHCcWOG80hYayJeyYNTqg2i8to|${FIREBASE_API_KEY}|" firebase-config.js
          sed -i "s|REPLACE_WITH_SUPABASE_PUBLISHABLE_KEY|${SUPABASE_PUBLISHABLE_KEY}|" firebase-config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
